<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - American Ford Parts</title>
    <link rel="stylesheet" href="../css/estilos_login.css"> <!-- usamos el mismo CSS -->
    <link rel="icon" type="image/x-icon" href="../img/icon.ico">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="navbar">
    <div class="logo">
        <img src="../img/logo.png" alt="Logo">
    </div>
    <div class="nav-links">
        <a href="../HTML/index.html">Inicio</a>
    </div>
</div>

<div class="background">
    <div class="main-content">
        <div class="login-container"> <!-- reutilizamos la misma clase -->
            <h2>Registro</h2>
            <form method="POST" action="../PHP/registro.php">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>

                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="********" required>

                <label for="confirmar">Confirmar Contraseña</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="********" required>

                <button type="submit" class="btn">Registrarse</button>
            </form>

            <p style="margin-top: 15px; font-size: 0.9em;">
                ¿Ya tienes cuenta? <a href="login.html" style="color:#a9d4f5;">Inicia sesión</a>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
